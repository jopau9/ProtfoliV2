<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 2400px; height: 1350px; overflow: hidden; position: relative;
    background: #0a0811;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  /* Fons: el mateix pla del joc, molt difuminat i fosc, perquè tot quedi en la paleta de la imatge. */
  .bg {
    position: absolute; inset: -80px; width: calc(100% + 160px); height: calc(100% + 160px);
    object-fit: cover; filter: blur(60px) saturate(1.2) brightness(0.45);
  }
  .tint {
    position: absolute; inset: 0;
    background:
      radial-gradient(1100px 800px at 32% 70%, rgba(124, 92, 255, 0.36), transparent 70%),
      radial-gradient(900px 700px at 18% 20%, rgba(40, 90, 200, 0.22), transparent 70%),
      linear-gradient(180deg, rgba(10, 8, 17, 0.2), rgba(10, 8, 17, 0.55));
  }
  .grain {
    position: absolute; inset: 0; opacity: 0.06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .frame {
    position: absolute; border-radius: 22px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10), 0 60px 160px rgba(0, 0, 0, 0.65), 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  .game { left: 1000px; top: 110px; width: 1180px; height: 664px; }
  .game img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .win { left: 330px; top: 390px; width: 1290px; background: #121019; }
  .bar {
    height: 56px; display: flex; align-items: center; padding: 0 22px; position: relative;
    background: #17141f; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .dots { display: flex; gap: 10px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255, 255, 255, 0.16); display: block; }
  .url {
    position: absolute; left: 50%; transform: translateX(-50%);
    height: 32px; padding: 0 22px; border-radius: 9px; display: flex; align-items: center; gap: 9px;
    background: rgba(255, 255, 255, 0.06); color: rgba(255, 255, 255, 0.62); font-size: 17px; letter-spacing: 0.2px;
  }
  .url svg { width: 14px; height: 14px; opacity: 0.7; }
  .win img { display: block; width: 1290px; height: 806px; }
</style>
</head>
<body>
  <img class="bg" src="../frames/full/t63.5.png">
  <div class="tint"></div>
  <div class="grain"></div>

  <div class="frame game"><img src="../frames/full/t63.5.png"></div>

  <div class="frame win">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="url">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
        visorrp.es
      </div>
    </div>
    <img src="../web/home2x.png">
  </div>
</body>
</html>
